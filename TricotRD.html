<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tricot R&D Platform — Warp Knitting Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg0: #0f1117; --bg1: #181c26; --bg2: #1f2535; --bg3: #252d3d;
    --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.18);
    --text1: #e8ecf5; --text2: #9aa3b8; --text3: #5c6680;
    --purple: #7F77DD; --teal: #1D9E75; --coral: #D85A30; --pink: #D4537E;
    --amber: #EF9F27; --red: #E24B4A; --green: #639922; --blue: #378ADD;
    --purple-bg: rgba(127,119,221,0.15); --teal-bg: rgba(29,158,117,0.15);
    --coral-bg: rgba(216,90,48,0.15); --red-bg: rgba(226,75,74,0.15);
    --amber-bg: rgba(239,159,39,0.15); --green-bg: rgba(99,153,34,0.15);
    --blue-bg: rgba(55,138,221,0.15);
    --radius: 8px; --radius-lg: 12px;
    --font: -apple-system, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font); font-size: 13px; color: var(--text1); background: var(--bg0); display: flex; flex-direction: column; }

  /* ── Titlebar ── */
  #titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--bg1);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap; min-height: 46px;
  }
  #titlebar .logo { font-size: 14px; font-weight: 600; color: var(--text1); letter-spacing: -0.02em; }
  #titlebar .logo span { color: var(--purple); }
  .tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  select.tb-sel {
    font-size: 12px; padding: 4px 8px; border: 1px solid var(--border2);
    border-radius: var(--radius); background: var(--bg2); color: var(--text1); cursor: pointer;
  }
  select.tb-sel:hover { border-color: var(--purple); }
  button.tb-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 5px 11px; border: 1px solid var(--border2);
    border-radius: var(--radius); background: var(--bg2); color: var(--text1); cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  button.tb-btn:hover { border-color: var(--purple); background: var(--purple-bg); color: var(--purple); }
  button.tb-btn.accent { background: var(--purple-bg); border-color: var(--purple); color: var(--purple); }
  button.tb-btn.success { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  button.tb-btn.danger-btn { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .tb-spacer { flex: 1; }
  .api-key-row { display: flex; align-items: center; gap: 6px; }
  .api-key-row input {
    font-size: 11px; padding: 4px 8px; width: 220px;
    border: 1px solid var(--border2); border-radius: var(--radius);
    background: var(--bg2); color: var(--text1); font-family: var(--font-mono);
  }
  .api-key-row input::placeholder { color: var(--text3); }
  .api-key-row label { font-size: 11px; color: var(--text2); }

  /* ── Main layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 260px; min-width: 220px; background: var(--bg1);
    border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  .sb-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sb-section h3 {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--text3); margin-bottom: 10px;
  }
  .field { margin-bottom: 9px; }
  .field label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 3px; }
  .field label .val { font-weight: 600; color: var(--text1); }
  .field input[type=range] { width: 100%; accent-color: var(--purple); cursor: pointer; }
  .field select, .field input[type=number] {
    width: 100%; font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--border2); border-radius: var(--radius);
    background: var(--bg2); color: var(--text1); cursor: pointer;
  }
  .field select:hover, .field select:focus { border-color: var(--purple); outline: none; }
  .lap-row { display: grid; grid-template-columns: 42px 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
  .bar-badge {
    font-size: 10px; font-weight: 700; padding: 3px 0; border-radius: 5px;
    text-align: center; border: 1px solid;
  }
  .lap-row select {
    font-size: 11px; padding: 4px 6px; border: 1px solid var(--border2);
    border-radius: var(--radius); background: var(--bg2); color: var(--text1); cursor: pointer; width: 100%;
  }
  .lap-row select:hover { border-color: var(--purple); }

  /* ── Content area ── */
  #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Tabs ── */
  #tabs {
    display: flex; background: var(--bg1); border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto;
  }
  #tabs::-webkit-scrollbar { height: 0; }
  .tab {
    padding: 10px 16px; font-size: 12px; cursor: pointer; white-space: nowrap;
    color: var(--text2); border-bottom: 2px solid transparent;
    transition: all .15s; user-select: none;
  }
  .tab:hover { color: var(--text1); }
  .tab.on { color: var(--purple); border-bottom-color: var(--purple); font-weight: 500; }

  /* ── Panel ── */
  #panel { flex: 1; overflow-y: auto; padding: 16px; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-track { background: var(--bg1); }
  #panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── Stat cards ── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 10px 14px; }
  .stat-card .n { font-size: 22px; font-weight: 600; color: var(--text1); line-height: 1.1; }
  .stat-card .l { font-size: 11px; color: var(--text2); margin-top: 3px; }

  /* ── Canvas ── */
  canvas.main-canvas {
    display: block; border-radius: var(--radius-lg);
    border: 1px solid var(--border); background: #0a0e1a;
  }
  .canvas-legend {
    display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; }

  /* ── Risk bars ── */
  .risk-row { margin-bottom: 12px; }
  .risk-header { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 12px; }
  .risk-track { height: 7px; border-radius: 4px; background: var(--bg3); overflow: hidden; }
  .risk-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }

  /* ── Badges ── */
  .badge {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 4px; border: 1px solid;
  }
  .badge-ok { background: var(--green-bg); color: #8bca3d; border-color: var(--green); }
  .badge-warn { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
  .badge-danger { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  .badge-info { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
  .badge-purple { background: var(--purple-bg); color: var(--purple); border-color: var(--purple); }

  /* ── Alert boxes ── */
  .alert {
    padding: 10px 14px; border-radius: var(--radius); font-size: 12px;
    line-height: 1.6; margin-bottom: 8px; border-left: 3px solid;
  }
  .alert-danger { background: var(--red-bg); color: #f5a5a5; border-color: var(--red); }
  .alert-warn { background: var(--amber-bg); color: var(--amber); border-color: var(--amber); }
  .alert-ok { background: var(--green-bg); color: #8bca3d; border-color: var(--green); }
  .alert-info { background: var(--blue-bg); color: #89bfee; border-color: var(--blue); }

  /* ── Library grid ── */
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .lib-card {
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 12px; background: var(--bg2); cursor: pointer; transition: all .15s;
  }
  .lib-card:hover { border-color: var(--purple); }
  .lib-card.selected { border: 2px solid var(--purple); }
  .lib-card-name { font-size: 12px; font-weight: 600; margin-top: 8px; color: var(--text1); }
  .lib-card-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .lib-card-badges { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .lib-card canvas { width: 100%; height: 90px; border-radius: 6px; border: 1px solid var(--border); }
  .lib-card-actions { display: flex; gap: 5px; margin-top: 10px; }
  .lib-card-actions button {
    flex: 1; font-size: 10px; padding: 4px 6px;
    border: 1px solid var(--border2); border-radius: var(--radius);
    background: var(--bg3); color: var(--text2); cursor: pointer; transition: all .12s;
  }
  .lib-card-actions button:hover { border-color: var(--purple); color: var(--purple); }
  .lib-card-actions button.del:hover { border-color: var(--red); color: var(--red); }

  /* ── Compare ── */
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .compare-card { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; background: var(--bg2); }
  .compare-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .compare-table { width: 100%; font-size: 11px; border-collapse: collapse; margin-top: 10px; }
  .compare-table td { padding: 3px 0; }
  .compare-table td:last-child { text-align: right; font-weight: 600; }
  .better { color: var(--green) !important; }
  .worse { color: var(--red) !important; }

  /* ── 3D Panel ── */
  .viz3d-wrap { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); }
  .viz3d-hud {
    position: absolute; top: 10px; left: 10px;
    background: rgba(10,14,26,0.82); color: var(--text1);
    font-size: 11px; padding: 8px 12px; border-radius: var(--radius);
    line-height: 1.8; pointer-events: none; border: 1px solid var(--border);
    max-width: 280px;
  }
  .viz3d-hud strong { color: var(--purple); }
  .viz3d-legend {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(10,14,26,0.82); color: var(--text2);
    font-size: 10px; padding: 7px 10px; border-radius: var(--radius);
    line-height: 1.8; pointer-events: none; border: 1px solid var(--border);
  }
  .viz3d-hint {
    position: absolute; bottom: 10px; right: 10px;
    background: rgba(10,14,26,0.7); color: var(--text3);
    font-size: 10px; padding: 5px 9px; border-radius: var(--radius);
    pointer-events: none;
  }
  .viz3d-controls {
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px; background: var(--bg1); border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .viz3d-controls label { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 5px; }
  .viz3d-controls input[type=range] { width: 80px; accent-color: var(--purple); }
  .viz3d-controls input[type=checkbox] { accent-color: var(--purple); }

  /* ── AI Chat ── */
  .ai-wrap { display: flex; flex-direction: column; height: calc(100vh - 180px); min-height: 400px; }
  .ai-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
  .ai-messages::-webkit-scrollbar { width: 4px; }
  .ai-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .ai-msg { padding: 10px 14px; border-radius: var(--radius-lg); font-size: 12px; line-height: 1.7; max-width: 85%; }
  .ai-msg.user { background: var(--purple-bg); border: 1px solid rgba(127,119,221,0.3); color: #c8c4f5; align-self: flex-end; }
  .ai-msg.assistant { background: var(--bg2); border: 1px solid var(--border); color: var(--text1); align-self: flex-start; }
  .ai-msg.loading { opacity: .6; }
  .ai-input-row { display: flex; gap: 8px; margin-top: 12px; flex-shrink: 0; }
  .ai-input-row input {
    flex: 1; font-size: 12px; padding: 8px 12px;
    border: 1px solid var(--border2); border-radius: var(--radius);
    background: var(--bg2); color: var(--text1); outline: none;
  }
  .ai-input-row input:focus { border-color: var(--purple); }
  .ai-input-row input::placeholder { color: var(--text3); }
  .ai-input-row button {
    font-size: 12px; padding: 8px 14px; border: 1px solid var(--purple);
    border-radius: var(--radius); background: var(--purple-bg); color: var(--purple); cursor: pointer;
  }
  .ai-input-row button:hover { background: var(--purple); color: #fff; }
  .ai-ctx-btn {
    font-size: 11px; padding: 4px 9px; border: 1px solid var(--border2);
    border-radius: var(--radius); background: var(--bg2); color: var(--text2);
    cursor: pointer; margin-top: 6px; display: inline-block;
  }
  .ai-ctx-btn:hover { border-color: var(--teal); color: var(--teal); }
  .ai-suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ai-sug {
    font-size: 11px; padding: 4px 9px; border: 1px solid var(--border2);
    border-radius: 20px; background: var(--bg3); color: var(--text2);
    cursor: pointer; transition: all .12s;
  }
  .ai-sug:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-bg); }

  /* ── Export / PDF preview ── */
  .export-preview {
    background: #fff; color: #111; border-radius: var(--radius-lg);
    padding: 32px; font-family: Georgia, serif; max-width: 720px; margin: 0 auto;
    border: 1px solid var(--border);
  }
  .export-preview h1 { font-size: 22px; font-weight: bold; color: #111; }
  .export-preview h2 { font-size: 14px; font-weight: bold; color: #333; border-bottom: 1px solid #ddd; padding-bottom: 4px; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
  .export-preview table { width: 100%; font-size: 11px; border-collapse: collapse; }
  .export-preview td { padding: 3px 0; }
  .export-preview td:last-child { text-align: right; font-weight: bold; }
  .export-actions { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }

  /* ── Stress map controls ── */
  .stress-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .stress-controls label { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .stress-legend-bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; width: 160px; margin-right: 4px; }
  .stress-seg { flex: 1; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 13px; margin-top: 6px; }

  /* ── Section heading ── */
  .section-heading { font-size: 13px; font-weight: 600; color: var(--text1); margin-bottom: 12px; }
  .section-sub { font-size: 11px; color: var(--text2); margin-bottom: 14px; }

  /* ── Divider ── */
  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  /* ── Chart container ── */
  .chart-container { position: relative; height: 220px; margin-top: 14px; }

  /* ── Scrollbar global ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg1); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── Tooltip ── */
  .tooltip-wrap { position: relative; display: inline-block; }
  .tooltip-wrap .tt {
    display: none; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
    background: var(--bg0); border: 1px solid var(--border2); color: var(--text1);
    font-size: 10px; padding: 4px 8px; border-radius: 5px; white-space: nowrap; z-index: 100;
  }
  .tooltip-wrap:hover .tt { display: block; }
</style>
</head>
<body>

<!-- ═══════════════════════ TITLEBAR ═══════════════════════ -->
<div id="titlebar">
  <div class="logo">Tricot <span>R&D</span> Platform</div>
  <div class="tb-sep"></div>
  <select class="tb-sel" id="preset-main">
    <option value="atlas">Atlas stitch</option>
    <option value="locknit">Locknit</option>
    <option value="satin">Satin / queen's</option>
    <option value="velvet">Velvet base</option>
    <option value="custom">Custom</option>
  </select>
  <button class="tb-btn" onclick="simulate()">&#9654; Simulate</button>
  <button class="tb-btn accent" onclick="saveToLibrary()">&#9673; Save to library</button>
  <button class="tb-btn success" onclick="showTab('export')">&#8595; Export PDF</button>
  <button class="tb-btn" onclick="showTab('viz3d')">&#9680; 3D Process</button>
  <div class="tb-spacer"></div>
  <div class="api-key-row">
    <label>AI API key:</label>
    <input type="password" id="api-key" placeholder="sk-ant-... (for AI analysis)" autocomplete="off">
    <button class="tb-btn" onclick="showTab('ai')">&#129504; AI Analysis</button>
  </div>
</div>

<!-- ═══════════════════════ MAIN ═══════════════════════ -->
<div id="main">

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sb-section">
    <h3>Machine setup</h3>
    <div class="field">
      <label>Gauge (needles/inch) <span class="val" id="v-gauge">28</span></label>
      <input type="range" id="gauge" min="14" max="44" step="2" value="28" oninput="sv('gauge');sim()">
    </div>
    <div class="field">
      <label>Speed (rpm) <span class="val" id="v-speed">600</span></label>
      <input type="range" id="speed" min="100" max="1200" step="50" value="600" oninput="sv('speed');sim()">
    </div>
    <div class="field">
      <label>Guide bars</label>
      <select id="bars" onchange="mc();rebuildBars();sim()">
        <option value="2">2 bars (GB1 + GB2)</option>
        <option value="3" selected>3 bars (GB1–3)</option>
        <option value="4">4 bars (GB1–4)</option>
      </select>
    </div>
  </div>

  <div class="sb-section">
    <h3>Yarn</h3>
    <div class="field">
      <label>dtex <span class="val" id="v-dtex">44</span></label>
      <input type="range" id="dtex" min="11" max="167" step="1" value="44" oninput="sv('dtex');sim()">
    </div>
    <div class="field">
      <label>Fiber type</label>
      <select id="yarn" onchange="mc();sim()">
        <option value="polyester">Polyester FDY</option>
        <option value="nylon">Nylon 6.6</option>
        <option value="elastane">Elastane (bare)</option>
        <option value="cotton">Cotton spun</option>
        <option value="modal">Modal</option>
      </select>
    </div>
    <div class="field">
      <label>Threading</label>
      <select id="threading" onchange="mc();sim()">
        <option value="full">Full set</option>
        <option value="half">Half set (1-in / 1-out)</option>
        <option value="third">1-in / 2-out</option>
      </select>
    </div>
  </div>

  <div class="sb-section">
    <h3>Lapping movements</h3>
    <div id="bars-ui"></div>
  </div>

  <div class="sb-section">
    <h3>Tension</h3>
    <div class="field">
      <label>Take-down (cN/cm) <span class="val" id="v-td">8</span></label>
      <input type="range" id="td" min="2" max="20" step="1" value="8" oninput="sv('td');sim()">
    </div>
    <div class="field">
      <label>Runner length (mm/rack) <span class="val" id="v-rl">1150</span></label>
      <input type="range" id="rl" min="700" max="1600" step="10" value="1150" oninput="sv('rl');sim()">
    </div>
    <div class="field">
      <label>Warp tension (cN) <span class="val" id="v-wt">35</span></label>
      <input type="range" id="wt" min="10" max="80" step="1" value="35" oninput="sv('wt');sim()">
    </div>
  </div>

  <div class="sb-section" style="border-bottom:none">
    <h3>Quick presets</h3>
    <div style="display:flex;flex-direction:column;gap:5px">
      <button class="tb-btn" style="justify-content:center" onclick="applyPreset('atlas')">Atlas stitch</button>
      <button class="tb-btn" style="justify-content:center" onclick="applyPreset('locknit')">Locknit</button>
      <button class="tb-btn" style="justify-content:center" onclick="applyPreset('satin')">Satin / queen's</button>
      <button class="tb-btn" style="justify-content:center" onclick="applyPreset('velvet')">Velvet base</button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div id="content">
  <div id="tabs">
    <div class="tab on" onclick="showTab('fabric',this)">Fabric 3D</div>
    <div class="tab" onclick="showTab('lapping',this)">Lapping diagram</div>
    <div class="tab" onclick="showTab('cross',this)">Cross-section</div>

  </div>

</div>

</div><!-- /main -->

<script>
// ════════════════════════════════════════════════════════
//  DATA & CONSTANTS
// ════════════════════════════════════════════════════════
const LAPS = {
  "1-0/0-1":{n:"Closed pillar",u:1,o:0,t:"chain"},
  "1-0/1-2":{n:"Open pillar",u:1,o:1,t:"tricot"},
  "2-3/1-0":{n:"Atlas",u:2,o:1,t:"atlas"},
  "3-4/1-0":{n:"Satin",u:3,o:1,t:"satin"},
  "2-3/2-1":{n:"Locknit",u:2,o:2,t:"locknit"},
  "1-2/1-0":{n:"Tricot stitch",u:1,o:1,t:"tricot"},
  "0-1/3-2":{n:"Rev. locknit",u:0,o:3,t:"locknit"},
  "0-0/1-1":{n:"Inlay",u:0,o:0,t:"inlay"},
  "4-5/1-0":{n:"Queen's cord",u:4,o:1,t:"satin"},
  "2-1/1-2":{n:"Plain tricot",u:2,o:1,t:"tricot"}
};
const LKEYS = Object.keys(LAPS);
const BC = ['#7F77DD','#1D9E75','#D85A30','#D4537E'];
const BB = ['rgba(127,119,221,0.15)','rgba(29,158,117,0.15)','rgba(216,90,48,0.15)','rgba(212,83,126,0.15)'];

const PRESETS = {
  atlas:  {gauge:28,speed:600,bars:3,dtex:44,yarn:"polyester",threading:"full",td:8,rl:1150,wt:35,laps:["2-3/1-0","1-0/0-1","1-0/1-2"]},
  locknit:{gauge:28,speed:550,bars:2,dtex:44,yarn:"polyester",threading:"full",td:9,rl:1100,wt:38,laps:["2-3/2-1","1-0/0-1"]},
  satin:  {gauge:32,speed:500,bars:3,dtex:33,yarn:"nylon",threading:"full",td:7,rl:1200,wt:30,laps:["3-4/1-0","1-0/0-1","1-0/1-2"]},
  velvet: {gauge:24,speed:400,bars:4,dtex:78,yarn:"polyester",threading:"half",td:6,rl:1300,wt:28,laps:["1-0/0-1","1-2/1-0","2-3/1-0","0-0/1-1"]}
};

const PHASES = [
  {n:'1. Rest / knockover', d:'Needles at low position. Old loops on needle shanks. Sinkers engaged.'},
  {n:'2. Clearing',          d:'Needles rise. Old loops slide below latches. Latches spring open.'},
  {n:'3. Underlap',          d:'Guide bars swing to back bed, traverse laterally (underlap movement).'},
  {n:'4. Overlap',           d:'Guide bars swing to front, traverse opposite direction. Yarn wraps hooks.'},
  {n:'5. Loop formation',    d:'Needles descend. Latches close. New loops drawn through old loops.'},
  {n:'6. Knockover',         d:'New loops formed. Old loops cast off. Takedown pulls fabric down.'},
];

let simData = {};
let library = [];
let compareA = null, compareB = null;
let activeTab = 'fabric';
let chartInst = null;
let aiMessages = [{role:'assistant',content:'Hello! I am your tricot knitting specialist AI.\n\nI can analyze your current machine setup, diagnose defect causes, optimize lapping movements, recommend yarn and tension settings, and explain any aspect of warp knitting technology.\n\nClick "Send setup" to inject your current configuration, or ask me anything below.'}];
let aiLoading = false;

// 3D state
let three = null;
let anim3dRunning = false;

// ════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════
function sv(id){ const el=document.getElementById(id); document.getElementById('v-'+id).textContent=el.value; }
function mc(){ document.getElementById('preset-main').value='custom'; }
function sim(){ simulate(); }
function getCfg(){
  const bars=parseInt(document.getElementById('bars').value);
  return {
    gauge:parseInt(document.getElementById('gauge').value),
    speed:parseInt(document.getElementById('speed').value),
    bars, dtex:parseInt(document.getElementById('dtex').value),
    yarn:document.getElementById('yarn').value,
    threading:document.getElementById('threading').value,
    td:parseInt(document.getElementById('td').value),
    rl:parseInt(document.getElementById('rl').value),
    wt:parseInt(document.getElementById('wt').value),
    laps:Array.from(document.querySelectorAll('.lap-sel')).map(s=>s.value)
  };
}

function rebuildBars(){
  const n=parseInt(document.getElementById('bars').value);
  const cur=Array.from(document.querySelectorAll('.lap-sel')).map(s=>s.value);
  const div=document.getElementById('bars-ui'); div.innerHTML='';
  for(let i=0;i<n;i++){
    const v=cur[i]||LKEYS[i%LKEYS.length];
    const row=document.createElement('div'); row.className='lap-row';
    row.innerHTML=`<div class="bar-badge" style="background:${BB[i]};color:${BC[i]};border-color:${BC[i]}">GB${i+1}</div>
      <select class="lap-sel" onchange="mc();sim()">
        ${LKEYS.map(k=>`<option value="${k}"${k===v?' selected':''}>${k} — ${LAPS[k].n}</option>`).join('')}
      </select>`;
    div.appendChild(row);
  }
}

function applyPreset(p){
  const pr=PRESETS[p]; if(!pr) return;
  document.getElementById('gauge').value=pr.gauge; sv('gauge');
  document.getElementById('speed').value=pr.speed; sv('speed');
  document.getElementById('bars').value=pr.bars;
  document.getElementById('dtex').value=pr.dtex; sv('dtex');
  document.getElementById('yarn').value=pr.yarn;
  document.getElementById('threading').value=pr.threading;
  document.getElementById('td').value=pr.td; sv('td');
  document.getElementById('rl').value=pr.rl; sv('rl');
  document.getElementById('wt').value=pr.wt||35; sv('wt');
  rebuildBars();
  const sels=document.querySelectorAll('.lap-sel');
  pr.laps.forEach((l,i)=>{ if(sels[i]) sels[i].value=l; });
  simulate();
}

document.getElementById('preset-main').addEventListener('change', e => {
  if(e.target.value!=='custom') { applyPreset(e.target.value); }
});

// ════════════════════════════════════════════════════════
//  SIMULATION ENGINE
// ════════════════════════════════════════════════════════
function computeRisks(cfg){
  const avgU=cfg.laps.reduce((s,l)=>s+(LAPS[l]?LAPS[l].u:1),0)/cfg.laps.length;
  const tf=cfg.threading==='full'?1:cfg.threading==='half'?0.6:0.4;
  const hasInlay=cfg.laps.some(l=>LAPS[l]&&LAPS[l].t==='inlay');

  let hole=0; if(cfg.gauge>36)hole+=25; if(cfg.dtex<22)hole+=30; if(cfg.td>14)hole+=20; if(tf<0.6)hole+=15; if(avgU<1)hole+=10;
  let brk=0;  if(cfg.speed>900)brk+=30;  if(cfg.dtex<22)brk+=25;  if(cfg.gauge>36)brk+=15;  if(cfg.td>14)brk+=20;  if(cfg.wt>60)brk+=10;
  let dist=0; if(cfg.bars===2&&avgU>2)dist+=35; if(cfg.rl>1400)dist+=25; if(cfg.td<4)dist+=20; if(hasInlay&&cfg.bars<3)dist+=20;
  let dens=0; if(cfg.speed>900)dens+=15; if(cfg.rl<800||cfg.rl>1500)dens+=20; if(cfg.td<3||cfg.td>16)dens+=20;
  let snag=0; if(avgU>=3)snag+=40; if(cfg.dtex<22)snag+=20; if(cfg.yarn==='elastane')snag+=15;
  let tens=0; if(cfg.wt>60)tens+=35; if(cfg.wt<15)tens+=25; if(cfg.td>16&&cfg.wt>50)tens+=20;

  const cpi=Math.round(cfg.gauge*(cfg.rl/1150)*0.85);
  const wpi=Math.round(cfg.gauge*tf);
  const cov=Math.min(99,Math.round(40+avgU*12+(cfg.dtex/167)*30));
  const str=cfg.yarn==='elastane'?90:cfg.yarn==='nylon'?55:40;
  const wt_g=Math.round(cpi*wpi*cfg.dtex*0.0004);
  const thick=Math.round((0.05+avgU*0.02+cfg.dtex*0.0003)*100)/100;

  return {
    risks:{hole:Math.min(hole,95),breakage:Math.min(brk,95),distortion:Math.min(dist,95),density:Math.min(dens,90),snag:Math.min(snag,95),tension:Math.min(tens,85)},
    stats:{cpi,wpi,coverage:cov,stretch:str,weight:wt_g,thickness:thick,avgU:avgU.toFixed(1)}
  };
}

function simulate(){
  const cfg=getCfg();
  simData={cfg,...computeRisks(cfg)};
  renderPanel();
}

// ════════════════════════════════════════════════════════
//  TAB SYSTEM
// ════════════════════════════════════════════════════════
const TAB_ORDER=['fabric','lapping','cross','stress','risks','library','compare','viz3d','ai','export'];

function showTab(name, el){
  activeTab=name;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('on', TAB_ORDER[i]===name);
  });
  if(name!=='viz3d' && three){ stopViz3D(); }
  renderPanel();
}

function renderPanel(){
  if(activeTab==='fabric')    renderFabric();
  else if(activeTab==='lapping') renderLapping();
  else if(activeTab==='cross')   renderCross();
  else if(activeTab==='stress')  renderStress();
  else if(activeTab==='risks')   renderRisks();
  else if(activeTab==='library') renderLibrary();
  else if(activeTab==='compare') renderCompare();
  else if(activeTab==='viz3d')   renderViz3D();
  else if(activeTab==='ai')      renderAI();
  else if(activeTab==='export')  renderExport();
}

//  DRAWING HELPERS
// ════════════════════════════════════════════════════════
function clrRisk(v){ return v>60?'#E24B4A':v>35?'#EF9F27':'#639922'; }
function badgeRisk(v){ const c=v>60?'danger':v>35?'warn':'ok'; const l=v>60?'HIGH':v>35?'MEDIUM':'LOW'; return `<span class="badge badge-${c}">${l}</span>`; }
function statGridHTML(s){
  return `<div class="stat-grid">
    <div class="stat-card"><div class="n">${s.cpi}</div><div class="l">Courses/inch</div></div>
    <div class="stat-card"><div class="n">${s.wpi}</div><div class="l">Wales/inch</div></div>

}

// ════════════════════════════════════════════════════════
//  FABRIC 3D TAB
// ════════════════════════════════════════════════════════
function renderFabric(){
  const p=document.getElementById('panel');
  p.innerHTML=(simData.stats?statGridHTML(simData.stats):'')+
    `<canvas id="fc" class="main-canvas" width="780" height="380" style="width:100%;height:380px"></canvas>
     <div class="canvas-legend" id="fab-leg"></div>`;
  drawFabric3D();
}

function drawFabric3D(){
  const canvas=document.getElementById('fc'); if(!canvas)return;
  const cfg=simData.cfg; if(!cfg)return;
  canvas.width=canvas.offsetWidth*devicePixelRatio;
  canvas.height=380*devicePixelRatio;
  canvas.style.height='380px';
  const ctx=canvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const w=canvas.offsetWidth, h=380;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,w,h);

  const cols=22,rows=14,cW=w/cols,cH=(h-28)/rows;
  const tf=cfg.threading==='full'?1:cfg.threading==='half'?0.6:0.4;

  // warp guides
  for(let c=0;c<cols;c++){
    if(cfg.threading==='half'&&c%2!==0)continue;
    if(cfg.threading==='third'&&c%3!==0)continue;
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(c*cW+cW/2,28); ctx.lineTo(c*cW+cW/2,h); ctx.stroke();
  }

  // stitch paths
  cfg.laps.forEach((lap,bi)=>{
    const m=LAPS[lap]; if(!m)return;
    ctx.strokeStyle=BC[bi]; ctx.lineWidth=bi===0?2:bi===1?1.7:1.3;
    for(let r=0;r<rows-1;r++){
      for(let c=0;c<cols-2;c++){
        if(cfg.threading==='half'&&c%2!==0)continue;
        const x0=c*cW+cW/2, y0=28+r*cH+cH/2;
        const xN=x0+m.u*cW, yN=y0+cH;
        if(xN<w){
          ctx.globalAlpha=0.72+bi*0.04;
          ctx.beginPath(); ctx.moveTo(x0,y0);
          ctx.bezierCurveTo(x0+m.u*cW*0.38,y0-7+bi*3, xN-m.u*cW*0.38,yN-7+bi*3, xN,yN);
          ctx.stroke();
          ctx.globalAlpha=0.88;
          ctx.beginPath(); ctx.arc(x0,y0+cH*0.48,2.5+bi*0.4,0,Math.PI*2);
          ctx.fillStyle=BC[bi]; ctx.fill();
        }
        ctx.globalAlpha=1;
      }
    }
  });

  // needle header
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(0,0,w,24);
  for(let c=0;c<cols;c++){
    ctx.fillStyle='#4a5568';
    ctx.beginPath(); ctx.arc(c*cW+cW/2,12,3.5,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='10px '+getComputedStyle(document.body).fontFamily;
  ctx.fillText(`${cfg.gauge} gauge · GB${cfg.bars} · ${cfg.yarn} ${cfg.dtex}dtex · ${cfg.threading}`,8,h-6);

  const leg=document.getElementById('fab-leg');
  if(leg) leg.innerHTML=cfg.laps.map((l,i)=>
    `<div class="legend-item"><div class="legend-line" style="background:${BC[i]}"></div>GB${i+1}: ${l} (${LAPS[l]?.n||''})</div>`
  ).join('')+`<div class="legend-item" style="margin-left:auto"><div class="legend-dot" style="background:#4a5568"></div>Needles</div>`;
}

// ════════════════════════════════════════════════════════
//  LAPPING DIAGRAM TAB
// ════════════════════════════════════════════════════════
function renderLapping(){
  const cfg=simData.cfg;
  if(!cfg){document.getElementById('panel').innerHTML='<div class="empty-state"><div class="icon">&#9881;</div><p>Run simulation first.</p></div>';return;}
  const h=50+cfg.laps.length*110;
  document.getElementById('panel').innerHTML=
    `<div class="section-heading">Lapping movement diagram (point paper notation)</div>
     <canvas id="lc" class="main-canvas" width="780" height="${h}" style="width:100%;height:${h}px"></canvas>`;
  drawLapping(cfg);
}

function drawLapping(cfg){
  const canvas=document.getElementById('lc'); if(!canvas)return;
  canvas.width=canvas.offsetWidth*devicePixelRatio;
  const h=50+cfg.laps.length*110;
  canvas.height=h*devicePixelRatio;
  canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const w=canvas.offsetWidth;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,w,h);
  const needles=13, margin=70, gap=(w-margin*2)/needles;

  cfg.laps.forEach((lap,bi)=>{
    const m=LAPS[lap]; if(!m)return;
    const yB=30+bi*110;
    ctx.fillStyle=BC[bi]; ctx.font='500 11px system-ui';
    ctx.fillText(`GB${bi+1}: ${lap} — ${m.n}`, margin, yB);
    for(let i=0;i<=needles;i++){
      const x=margin+i*gap;
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,yB+14); ctx.lineTo(x,yB+92); ctx.stroke();
      [yB+14,yB+92].forEach(y=>{
        ctx.fillStyle='#3a4460';
        ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=0.5;
        ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.stroke();
      });
    }
    const parts=lap.split('/');
    const fwd=parts[0]?parts[0].split('-').map(Number):[0,1];
    const bwd=parts[1]?parts[1].split('-').map(Number):[0,1];
    const sx=margin+4*gap;
    ctx.strokeStyle=BC[bi]; ctx.lineWidth=2.5; ctx.globalAlpha=0.9;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx,yB+14); ctx.lineTo(sx+(fwd[1]-fwd[0])*gap,yB+92); ctx.stroke();
    const mx=sx+(fwd[1]-fwd[0])*gap;
    ctx.beginPath(); ctx.moveTo(mx,yB+92); ctx.lineTo(mx+(bwd[1]-bwd[0])*gap,yB+14); ctx.stroke();
    ctx.fillStyle=BC[bi]; ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(sx,yB+14,5.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx,yB+92,5.5,0,Math.PI*2); ctx.fill();
  });
}

// ════════════════════════════════════════════════════════
//  CROSS-SECTION TAB
// ════════════════════════════════════════════════════════
function renderCross(){
  const cfg=simData.cfg;
  if(!cfg){document.getElementById('panel').innerHTML='<div class="empty-state"><p>Run simulation first.</p></div>';return;}
  document.getElementById('panel').innerHTML=
    `<div class="section-heading">Cross-section view — guide bars &amp; needle bed</div>
     <canvas id="xc" class="main-canvas" width="780" height="360" style="width:100%;height:360px"></canvas>`;
  drawCross(cfg);
}

function drawCross(cfg){
  const canvas=document.getElementById('xc'); if(!canvas)return;
  canvas.width=canvas.offsetWidth*devicePixelRatio; canvas.height=360*devicePixelRatio;
  canvas.style.height='360px';
  const ctx=canvas.getContext('2d'); ctx.scale(devicePixelRatio,devicePixelRatio);
  const w=canvas.offsetWidth, h=360;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,w,h);
  const n=14, gap=w/(n+2), cx=w/2, cyNeedle=h-90;

  // perspective guide bars
  cfg.laps.forEach((lap,bi)=>{
    const yOff=-80+bi*35;
    const barY=cyNeedle+yOff;
    ctx.strokeStyle=BC[bi]; ctx.lineWidth=3; ctx.globalAlpha=0.7;
    ctx.beginPath(); ctx.moveTo(30,barY); ctx.lineTo(w-30,barY); ctx.stroke();
    for(let i=0;i<n;i++){
      const x=gap*(i+1);
      ctx.fillStyle=BC[bi]; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(x,barY,5.5,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.arc(x,barY,5.5,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=BC[bi]; ctx.font='500 10px system-ui';
    ctx.fillText(`GB${bi+1} (${lap})`, w-100, barY-8);
  });

  // needle bed
  const nbY=cyNeedle+10;
  ctx.fillStyle='#1e2840'; ctx.fillRect(20,nbY,w-40,18); ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=0.5; ctx.strokeRect(20,nbY,w-40,18);
  for(let i=0;i<n;i++){
    const x=gap*(i+1);
    ctx.fillStyle='#4a5a7a';
    ctx.beginPath(); ctx.moveTo(x-3,nbY); ctx.lineTo(x,nbY-34); ctx.lineTo(x+3,nbY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.arc(x,nbY-38,5,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=BC[i%BC.length]; ctx.lineWidth=1.5; ctx.globalAlpha=0.7;
    ctx.beginPath(); ctx.arc(x,nbY-38,5,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='10px system-ui';
  ctx.fillText('Needle bed',25,nbY+13);
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(20,nbY+20,w-40,40);
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillText('Sinker bed / knockover region',25,nbY+38);
}

function drawStressMap(){
  const canvas=document.getElementById('stc'); if(!canvas)return;
  canvas.width=canvas.offsetWidth*devicePixelRatio; canvas.height=340*devicePixelRatio;
  canvas.style.height='340px';
  const ctx=canvas.getContext('2d'); ctx.scale(devicePixelRatio,devicePixelRatio);
  const w=canvas.offsetWidth, h=340, cfg=simData.cfg;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,w,h);
  const cols=24,rows=15,cW=w/cols,cH=h/rows;
  const tf=cfg.threading==='full'?1:cfg.threading==='half'?0.5:0.33;
  const avgU=cfg.laps.reduce((s,l)=>s+(LAPS[l]?LAPS[l].u:1),0)/cfg.laps.length;
  const mode=document.getElementById('sm')?.value||'combined';

  const HCOLS=['#0d1f36','#1a3a6a','#EF9F27','#E24B4A','#7a1010'];
  let maxS=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const edge=Math.abs(c-cols/2)/(cols/2)*0.3;
    const rv=Math.sin(r*0.9+c*0.6)*0.14;
    let gf=1; if(cfg.threading==='half'&&c%2!==0)gf=0.18; if(cfg.threading==='third'&&c%3!==0)gf=0.12;
    let base=(cfg.td/20)+(cfg.speed/1200)*0.3+(cfg.wt/80)*0.4;
    let s=0;
    if(mode==='loop')s=(base+rv+avgU*0.1)*gf;
    else if(mode==='warp')s=(cfg.wt/80)*0.8+edge+rv*0.3;
    else s=(base*0.5+edge*0.3+avgU*0.12+rv)*gf;
    s=Math.min(1,Math.max(0,s));
    if(s>maxS)maxS=s;
    const ci=Math.floor(s*4.99);
    ctx.fillStyle=HCOLS[ci]; ctx.globalAlpha=0.75+s*0.25;
    ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(c*cW+1,r*cH+1,cW-2,cH-2,2); else ctx.rect(c*cW+1,r*cH+1,cW-2,cH-2);
    ctx.fill();
    if(s>0.72){
      ctx.strokeStyle='#E24B4A'; ctx.lineWidth=1.5; ctx.globalAlpha=1;
      ctx.strokeRect(c*cW+1,r*cH+1,cW-2,cH-2);
    }
    ctx.globalAlpha=1;
  }

  // overlay yarn
  cfg.laps.forEach((lap,bi)=>{
    const m=LAPS[lap]; if(!m)return;
    ctx.strokeStyle=BC[bi]; ctx.lineWidth=0.8; ctx.globalAlpha=0.35;
    for(let r=0;r<rows-1;r+=2) for(let c=0;c<cols-m.u-1;c+=2){
      const x0=c*cW+cW/2,y0=r*cH+cH/2,xN=x0+m.u*cW,yN=y0+cH;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(xN,yN); ctx.stroke();
    }
    ctx.globalAlpha=1;
  });

  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='10px system-ui';
  ctx.fillText(`Peak stress index: ${(maxS*100).toFixed(0)}%  |  Mode: ${mode}  |  Gauge: ${cfg.gauge}  |  Warp tension: ${cfg.wt}cN`,8,h-5);

  const alerts=[]; const alertDiv=document.getElementById('stress-alerts');
  if(maxS>0.72) alerts.push({t:'danger',m:'Critical stress zones detected (red cells). Recommended actions: reduce take-down tension by 20–30%, check warp tension for over-tensioning, consider reducing machine speed.'});
  if(cfg.threading!=='full') alerts.push({t:'warn',m:'Partial threading creates alternating high/low-stress columns. Verify sinker timing is calibrated for gap rows to prevent loop distortion.'});
  if(avgU>2.5) alerts.push({t:'warn',m:'Long underlap (avg '+avgU.toFixed(1)+' needles) increases lateral yarn tension. Consider adding an inlay bar or reducing underlap length.'});
  if(alerts.length===0) alerts.push({t:'ok',m:'Stress distribution is within acceptable limits for the current setup. Monitor for edge effects at selvedge.'});
  if(alertDiv) alertDiv.innerHTML=alerts.map(a=>`<div class="alert alert-${a.t}">${a.m}</div>`).join('');
}

}

function drawThumb(idx){
  const canvas=document.getElementById(`thumb-${idx}`); if(!canvas)return;
  const cfg=library[idx].cfg;
  canvas.width=canvas.offsetWidth*devicePixelRatio||190; canvas.height=90*devicePixelRatio;
  const ctx=canvas.getContext('2d'); ctx.scale(devicePixelRatio,devicePixelRatio);
  const w=canvas.offsetWidth||190, h=90;
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,w,h);
  const cols=12,rows=6,cW=w/cols,cH=h/rows;
  cfg.laps.forEach((lap,bi)=>{
    const m=LAPS[lap]; if(!m)return;
    ctx.strokeStyle=BC[bi]; ctx.lineWidth=1.4; ctx.globalAlpha=0.7;
    for(let r=0;r<rows-1;r++) for(let c=0;c<cols-m.u-1;c++){
      const x0=c*cW+cW/2,y0=r*cH+cH/2,xN=x0+m.u*cW,yN=y0+cH;
      if(xN<w){ctx.beginPath();ctx.moveTo(x0,y0);ctx.bezierCurveTo(x0+m.u*cW*0.4,y0-3,xN-m.u*cW*0.4,yN-3,xN,yN);ctx.stroke();}
    }
    ctx.globalAlpha=1;
  });
}

function saveToLibrary(){
  if(!simData.cfg){alert('Run a simulation first.');return;}
  const name=`${simData.cfg.yarn} ${simData.cfg.gauge}g / ${simData.cfg.laps[0]}`;
  library.push({name,cfg:{...simData.cfg,laps:[...simData.cfg.laps]},risks:{...simData.risks},stats:{...simData.stats},ts:Date.now()});
  showTab('library');
}

function loadFromLib(idx){
  const cfg=library[idx].cfg;
  document.getElementById('gauge').value=cfg.gauge; sv('gauge');
  document.getElementById('speed').value=cfg.speed; sv('speed');
  document.getElementById('bars').value=cfg.bars;
  document.getElementById('dtex').value=cfg.dtex; sv('dtex');
  document.getElementById('yarn').value=cfg.yarn;
  document.getElementById('threading').value=cfg.threading;
  document.getElementById('td').value=cfg.td; sv('td');
  document.getElementById('rl').value=cfg.rl; sv('rl');
  document.getElementById('wt').value=cfg.wt||35; sv('wt');
  rebuildBars();
  const sels=document.querySelectorAll('.lap-sel');
  cfg.laps.forEach((l,i)=>{if(sels[i])sels[i].value=l;});
  simulate(); showTab('fabric');
}

function deleteLib(idx){ library.splice(idx,1); if(compareA===idx)compareA=null; if(compareB===idx)compareB=null; renderLibrary(); }
function toggleCompare(idx){
  if(compareA===idx)compareA=null;
  else if(compareB===idx)compareB=null;
  else if(compareA===null)compareA=idx;
  else compareB=idx;
  renderLibrary();
}

          <tr><td colspan="2" style="padding-top:6px;font-size:10px;color:var(--text3);text-transform:uppercase">Risk scores</td></tr>

  setTimeout(()=>{

          if(xN<w){ctx.beginPath();ctx.moveTo(x0,y0);ctx.bezierCurveTo(x0+m.u*cW*0.4,y0-3,xN-m.u*cW*0.4,yN-3,xN,yN);ctx.stroke();}
        }
        ctx.globalAlpha=1;
      });
    });
  },80);
}

function init3D(preset){
  const canvas=document.getElementById('c3d'); if(!canvas)return;
  const W=canvas.offsetWidth, H=480;
  canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio;

  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(W,H);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0e1a);
  scene.fog=new THREE.Fog(0x0a0e1a,35,80);

  const camera=new THREE.PerspectiveCamera(45,W/H,0.1,200);
  camera.position.set(0,12,22);
  const target=new THREE.Vector3(0,1,0);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff,0.45));
  const dir=new THREE.DirectionalLight(0xffffff,0.9); dir.position.set(8,18,10); dir.castShadow=true; dir.shadow.mapSize.set(1024,1024); scene.add(dir);
  scene.add(new THREE.DirectionalLight(0x6688cc,0.3).position.set(-8,4,-6));
  const pl=new THREE.PointLight(0x7F77DD,0.7,30); pl.position.set(-4,8,4); scene.add(pl);
  const pl2=new THREE.PointLight(0x1D9E75,0.4,20); pl2.position.set(5,6,-3); scene.add(pl2);

  // Camera orbit
  let isDrag=false,lastM={x:0,y:0},theta=0.2,phi=0.38,radius=22;
  function updateCam(){ camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta)); camera.lookAt(target); }
  updateCam();
  canvas.addEventListener('mousedown',e=>{isDrag=true;lastM={x:e.clientX,y:e.clientY};});
  window.addEventListener('mouseup',()=>isDrag=false);
  window.addEventListener('mousemove',e=>{if(!isDrag)return;theta-=(e.clientX-lastM.x)*0.008;phi=Math.max(0.08,Math.min(1.45,phi-(e.clientY-lastM.y)*0.008));lastM={x:e.clientX,y:e.clientY};updateCam();});
  canvas.addEventListener('wheel',e=>{radius=Math.max(6,Math.min(45,radius+e.deltaY*0.04));updateCam();e.preventDefault();},{passive:false});

  // Grid floor
  const grid=new THREE.GridHelper(30,30,0x1a2244,0x1a2244); grid.position.y=-1; scene.add(grid);

  // Needle bed
  const bedGeo=new THREE.BoxGeometry(13,0.4,2.6);
  const bedMat=new THREE.MeshPhongMaterial({color:0x1e2840,shininess:40});
  const bed=new THREE.Mesh(bedGeo,bedMat); bed.receiveShadow=true; scene.add(bed);

  // Sinker bar
  const sinkerGrp=new THREE.Group();
  const sinkerBeam=new THREE.Mesh(new THREE.BoxGeometry(13,0.12,0.25),new THREE.MeshPhongMaterial({color:0x2a3a5a}));
  sinkerGrp.add(sinkerBeam);
  for(let i=0;i<13;i++){
    const x=(i-6)*1.0;
    const sk=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.38,0.14),new THREE.MeshPhongMaterial({color:0x3a4a6a}));
    sk.position.set(x,-0.22,0); sinkerGrp.add(sk);
  }
  sinkerGrp.position.set(0,0.65,0.85); scene.add(sinkerGrp);

  // Needles
  const NUM=12, SP=1.0, NH=3.5, NT=2.8;
  const needles=[];
  for(let i=0;i<NUM;i++){
    const x=(i-(NUM-1)/2)*SP;
    const grp=new THREE.Group(); grp.position.set(x,0,0);
    const shaftGeo=new THREE.CylinderGeometry(0.055,0.065,NH,8);
    const shaft=new THREE.Mesh(shaftGeo,new THREE.MeshPhongMaterial({color:0xb0b8c8,shininess:140}));
    shaft.position.y=NH/2; shaft.castShadow=true; grp.add(shaft);
    const hook=new THREE.Mesh(new THREE.TorusGeometry(0.12,0.032,6,14,Math.PI),new THREE.MeshPhongMaterial({color:0xd4dce8,shininess:200}));
    hook.position.y=NH+0.09; hook.rotation.z=-Math.PI/2; grp.add(hook);
    const latch=new THREE.Mesh(new THREE.BoxGeometry(0.038,0.26,0.038),new THREE.MeshPhongMaterial({color:0xc0c8d8,shininess:120}));
    latch.position.y=NH-0.1; latch.rotation.z=0.4; grp.add(latch);
    scene.add(grp);
    needles.push({grp,latch,phase:i/NUM});
  }

  // Guide bars
  const guideBars=[];
  for(let b=0;b<preset.bars;b++){
    const grp=new THREE.Group();
    const barY=5.5+b*0.9;
    const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(preset.colors[b]),shininess:80,transparent:true,opacity:0.88});
    const beam=new THREE.Mesh(new THREE.BoxGeometry(14,0.1,0.18),mat); grp.add(beam);
    const eyes=[];
    for(let i=0;i<NUM;i++){
      const x=(i-(NUM-1)/2)*SP;
      const eg=new THREE.Group(); eg.position.x=x;
      const ring=new THREE.Mesh(new THREE.TorusGeometry(0.1,0.028,8,16),mat); eg.add(ring); grp.add(eg); eyes.push(eg);
    }
    grp.position.set(0,barY,0); scene.add(grp);
    guideBars.push({grp,eyes,barY});
  }

  // Yarn lines (live)
  let yarnMeshes=[];
  function clearYarn(){ yarnMeshes.forEach(m=>scene.remove(m)); yarnMeshes=[]; }
  function addYarnSegment(pts,color,r=0.04){
    if(pts.length<2)return;
    const curve=new THREE.CatmullRomCurve3(pts);
    const geo=new THREE.TubeGeometry(curve,Math.max(4,pts.length*3),r,6,false);
    const mesh=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:new THREE.Color(color),shininess:60}));
    mesh.castShadow=true; scene.add(mesh); yarnMeshes.push(mesh);
  }

  // Fabric rows
  const fabricRows=[], MAX_ROWS=7;
  function addFabricRow(rowY){
    if(!document.getElementById('fb3d')?.checked)return;
    const row=[];
    for(let i=0;i<NUM;i++){
      const x=(i-(NUM-1)/2)*SP;
      for(let b=0;b<Math.min(preset.bars,2);b++){
        const ul=preset.underlap;
        const pts=[
          new THREE.Vector3(x-ul*0.5*SP,rowY+0.08,b*0.09),
          new THREE.Vector3(x-ul*0.25*SP,rowY+0.28,b*0.09),
          new THREE.Vector3(x,rowY+0.38,b*0.09),
          new THREE.Vector3(x+ul*0.25*SP,rowY+0.28,b*0.09),
          new THREE.Vector3(x+ul*0.5*SP,rowY+0.08,b*0.09)
        ];
        const curve=new THREE.CatmullRomCurve3(pts);
        const geo=new THREE.TubeGeometry(curve,10,0.036,6,false);
        const m=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:new THREE.Color(preset.colors[b]),shininess:60,transparent:true,opacity:0.82}));
        m.castShadow=true; scene.add(m); row.push(m);
      }
    }
    fabricRows.push(row);
    if(fabricRows.length>MAX_ROWS){ const old=fabricRows.shift(); old.forEach(m=>scene.remove(m)); }
  }

  // State
  let t=0, playing=true, speed=1, yarnTimer=0, lastRow=-1;
  const state={running:true};
  three=state;

  // Controls
  document.getElementById('play3d').addEventListener('click',()=>{
    playing=!playing;
    document.getElementById('play3d').innerHTML=playing?'&#9646;&#9646; Pause':'&#9654; Play';
  });
  document.getElementById('sp3d').addEventListener('input',e=>{
    speed=parseFloat(e.target.value);
    document.getElementById('sp3d-lbl').textContent=speed.toFixed(1)+'x';
  });
  document.getElementById('xray3d')?.addEventListener('change',e=>{
    const op=e.target.checked?0.28:0.88;
    guideBars.forEach(gb=>{ gb.grp.traverse(o=>{ if(o.material)o.material.opacity=op; }); });
    needles.forEach(nd=>{ nd.grp.traverse(o=>{ if(o.material)o.material.opacity=op; }); });
  });

  const hudEl=document.getElementById('hud3d');
  const legEl=document.getElementById('leg3d');
  if(legEl) legEl.innerHTML=preset.laps.map((l,i)=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${preset.colors[i]};margin-right:4px"></span>GB${i+1}: ${l}`).join('<br>');

  function loop(){
    if(!state.running){ renderer.render(scene,camera); return; }
    requestAnimationFrame(loop);
    if(!playing){ renderer.render(scene,camera); return; }

    t+=0.008*speed;
    const cycle=t%1, phI=Math.floor(cycle*6);

    // Needles
    needles.forEach((nd,i)=>{
      const nc=(cycle+(i/NUM)*0.15)%1;
      let yOff=0;
      if(nc<0.15)      yOff=(nc/0.15)*NT;
      else if(nc<0.35) yOff=NT;
      else if(nc<0.55) yOff=NT*(1-(nc-0.35)/0.2);
      nd.grp.position.y=yOff;
      nd.latch.rotation.z=yOff>NT*0.55?-0.08:0.4;
    });

    // Guide bars
    guideBars.forEach((gb,b)=>{
      const gc=(cycle+b*0.08)%1;
      let z=0;
      if(gc<0.3)       z=-0.55;
      else if(gc<0.42) z=-0.55+((gc-0.3)/0.12)*1.1;
      else if(gc<0.65) z=0.55;
      else if(gc<0.75) z=0.55-((gc-0.65)/0.1)*1.1;
      else             z=-0.55;
      const lp=(gc*2)%1;
      const ul=preset.underlap;
      let xShift=lp<0.5?Math.sin(lp*Math.PI*2)*ul*SP*0.5:Math.sin((lp-0.5)*Math.PI*2)*ul*SP*-0.5;
      gb.grp.position.x=xShift; gb.grp.position.z=z; gb.grp.position.y=gb.barY;
    });

    // Sinker
    sinkerGrp.position.z=0.85+Math.sin(cycle*Math.PI*2)*0.38;

    // Yarn
    yarnTimer++;
    const showYarn=document.getElementById('yn3d')?.checked!==false;
    if(yarnTimer%3===0&&showYarn){
      clearYarn();
      guideBars.forEach((gb,b)=>{
        const bX=gb.grp.position.x, bZ=gb.grp.position.z, bY=gb.barY;
        const pts=[new THREE.Vector3(-9,bY+1.2,bZ-0.5)];
        for(let i=0;i<NUM;i++){
          const x=(i-(NUM-1)/2)*SP+bX;
          pts.push(new THREE.Vector3(x,bY+Math.sin(i*0.7+t*4)*0.07,bZ));
        }
        pts.push(new THREE.Vector3(9,bY+1.2,bZ-0.5));
        addYarnSegment(pts,preset.colors[b],0.04);
        if(bZ>0.1){
          for(let i=0;i<NUM;i+=2){
            const x=(i-(NUM-1)/2)*SP+bX;
            const nhY=needles[i].grp.position.y+NH+0.09;
            addYarnSegment([
              new THREE.Vector3(x,bY,bZ),
              new THREE.Vector3(x,bY-1.0,bZ*0.5),
              new THREE.Vector3(x,nhY,0.06)
            ],preset.colors[b],0.03);
          }
        }
      });
    }

    // Fabric
    if(cycle<0.05&&Math.floor(t)>lastRow){
      lastRow=Math.floor(t);
      addFabricRow(-lastRow*0.52);
      fabricRows.forEach((row,ri)=>{ row.forEach(m=>{ m.position.y=-(fabricRows.length-1-ri)*0.52; }); });
    }
    const td=(cycle%1)*0.006*speed;
    fabricRows.forEach(row=>row.forEach(m=>m.position.y-=td));

    // Fabric visibility
    const showFab=document.getElementById('fb3d')?.checked!==false;
    fabricRows.forEach(row=>row.forEach(m=>m.visible=showFab));

    // HUD
    const showLbl=document.getElementById('lb3d')?.checked!==false;
    if(hudEl){ hudEl.style.display=showLbl?'block':'none'; if(showLbl){ const ph=PHASES[Math.min(phI,5)]; hudEl.innerHTML=`<strong>${ph.n}</strong><br><span style="opacity:.8;font-size:10px">${ph.d}</span><br><span style="opacity:.4;font-size:9px">Cycle: ${(cycle*100).toFixed(0)}%</span>`; } }

    renderer.render(scene,camera);
  }
  loop();
}

function renderAI(){
  const p=document.getElementById('panel');
  p.innerHTML=`
    <div class="ai-wrap">
      <div class="ai-messages" id="ai-msgs">${aiMessages.map(m=>`<div class="ai-msg ${m.role}">${m.content.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>`).join('')}</div>
      <div style="flex-shrink:0">
        <div class="ai-suggestions">
          <span class="ai-sug" onclick="triggerAI('What are the main risks in my current setup and how do I fix them?')">Diagnose my setup</span>
          <span class="ai-sug" onclick="triggerAI('Recommend optimal lapping movements for my gauge and yarn type.')">Optimize lapping</span>
          <span class="ai-sug" onclick="triggerAI('What take-down tension and runner length should I use for this yarn?')">Tension advice</span>
          <span class="ai-sug" onclick="triggerAI('Explain the difference between Atlas, Locknit, and Satin stitch structures.')">Compare stitch types</span>
          <span class="ai-sug" onclick="triggerAI('How do I troubleshoot holes and runs appearing in my tricot fabric?')">Troubleshoot holes</span>
        </div>
        <div class="ai-input-row">
          <input type="text" id="ai-inp" placeholder="Ask anything about tricot knitting, your setup, defects, optimization..." onkeydown="if(event.key==='Enter')sendAI()">
          <button onclick="injectCtx()" class="ai-ctx-btn">&#128203; Send setup</button>
          <button onclick="sendAI()">&#10148; Send</button>
        </div>
      </div>
    </div>`;
  scrollAI();
}

function scrollAI(){ setTimeout(()=>{ const m=document.getElementById('ai-msgs'); if(m)m.scrollTop=m.scrollHeight; },50); }

function injectCtx(){
  if(!simData.cfg)return;
  const {cfg,risks,stats}=simData;
  const txt=`Current machine configuration:\n- Gauge: ${cfg.gauge} needles/inch, Speed: ${cfg.speed} rpm, Guide bars: ${cfg.bars}\n- Yarn: ${cfg.yarn} ${cfg.dtex}dtex, Threading: ${cfg.threading}\n- Lapping movements: ${cfg.laps.join(' / ')}\n- Take-down tension: ${cfg.td} cN/cm, Runner length: ${cfg.rl} mm/rack, Warp tension: ${cfg.wt} cN\n- Predicted CPI: ${stats.cpi}, WPI: ${stats.wpi}, Coverage: ${stats.coverage}%, Weight: ${stats.weight} g/m²\n- Risk scores: hole formation ${risks.hole}%, yarn breakage ${risks.breakage}%, distortion ${risks.distortion}%, density ${risks.density}%, snag ${risks.snag}%, tension ${risks.tension}%\n\nPlease analyze this setup and provide specific recommendations.`;
  const inp=document.getElementById('ai-inp'); if(inp)inp.value=txt;
}

function triggerAI(msg){
  const inp=document.getElementById('ai-inp'); if(inp)inp.value=msg; sendAI();
}

async function sendAI(){
  const inp=document.getElementById('ai-inp'); if(!inp)return;
  const msg=inp.value.trim(); if(!msg||aiLoading)return;
  const apiKey=document.getElementById('api-key').value.trim();
  if(!apiKey){ alert('Please enter your Anthropic API key in the top bar to use AI analysis.\n\nYou can get one at console.anthropic.com'); return; }
  inp.value=''; aiMessages.push({role:'user',content:msg}); aiLoading=true;
  renderAI();
  const cfgCtx=simData.cfg?`\n\nCurrent setup: Gauge ${simData.cfg.gauge}, ${simData.cfg.bars} guide bars, ${simData.cfg.yarn} ${simData.cfg.dtex}dtex, lapping: ${simData.cfg.laps.join(' / ')}, take-down ${simData.cfg.td}cN/cm, runner ${simData.cfg.rl}mm/rack, warp tension ${simData.cfg.wt}cN.`:'';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:1200,
        system:`You are a specialist in warp knitting and tricot machine engineering. You have deep expertise in stitch construction, guide bar lapping movements, fabric defect diagnosis, yarn behavior, machine timing, and R&D optimization. Give precise, technical, actionable responses. When diagnosing problems, cite specific parameters. When recommending changes, give exact values (e.g. "reduce take-down from 8 to 5 cN/cm"). Use proper textile engineering terminology. This is a desktop R&D tool used by knitting engineers.${cfgCtx}`,
        messages:aiMessages
      })
    });
    const data=await resp.json();
    const reply=data.content?.[0]?.text||'Unable to get a response. Please check your API key.';
    aiMessages.push({role:'assistant',content:reply});
  } catch(e){
    aiMessages.push({role:'assistant',content:'Connection error: '+e.message+'\n\nPlease check your internet connection and API key.'});
  }
  aiLoading=false; renderAI();
}

  const statusBg=maxRisk>60?'#fdf0ef':maxRisk>35?'#fef9e7':'#eafaf1';

    </div>

        <div>
          <div style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-bottom:4px">Tricot R&D Platform — Fabric Configuration Report</div>
          <h1>${cfg.yarn.charAt(0).toUpperCase()+cfg.yarn.slice(1)} ${cfg.gauge}g / ${cfg.laps[0]}</h1>

        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:#888;margin-bottom:4px">Overall status</div>
          <div style="background:${statusBg};color:${statusColor};font-size:12px;font-weight:bold;padding:6px 14px;border-radius:5px;border:1px solid ${statusColor}40">${status}</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <h2>Machine configuration</h2>
          <table>
            ${[['Gauge',cfg.gauge+' needles/inch'],['Guide bars',cfg.bars],['Machine speed',cfg.speed+' rpm'],['Yarn fiber',cfg.yarn],['Yarn dtex',cfg.dtex],['Threading',cfg.threading],['Take-down tension',cfg.td+' cN/cm'],['Runner length',cfg.rl+' mm/rack'],['Warp tension',cfg.wt+' cN']].map(([l,v])=>`<tr><td style="color:#555;padding:3px 0">${l}</td><td>${v}</td></tr>`).join('')}
          </table>
          <h2>Lapping movements</h2>
          <table>
            ${cfg.laps.map((l,i)=>`<tr><td style="color:#555;padding:3px 0">GB${i+1}</td><td>${l} — ${LAPS[l]?.n||''}</td></tr>`).join('')}
          </table>
        </div>
        <div>
          <h2>Predicted fabric properties</h2>
          <table>
            ${[['Courses per inch (CPI)',stats.cpi],['Wales per inch (WPI)',stats.wpi],['Coverage factor',stats.coverage+'%'],['Estimated weight',stats.weight+' g/m²'],['Estimated thickness',stats.thickness+' mm'],['Stretch recovery',stats.stretch+'%'],['Avg underlap',stats.avgU+' needles']].map(([l,v])=>`<tr><td style="color:#555;padding:3px 0">${l}</td><td>${v}</td></tr>`).join('')}
          </table>
        </div>
      </div>
      <h2 style="margin-top:18px">Defect risk assessment</h2>
      ${Object.entries(risks).map(([k,v])=>{
        const c=v>60?'#c0392b':v>35?'#d68910':'#1e8449';
        const l=v>60?'HIGH':v>35?'MEDIUM':'LOW';
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
          <span style="font-size:11px;color:#444;width:170px;flex-shrink:0">${RLBLS[k]}</span>
          <div style="flex:1;height:7px;background:#eee;border-radius:4px;overflow:hidden"><div style="width:${v}%;height:100%;background:${c}"></div></div>
          <span style="font-size:10px;font-weight:bold;color:${c};width:60px;text-align:right">${l} — ${v}%</span>
        </div>`;
      }).join('')}
      <div style="margin-top:18px;padding:12px 14px;background:#f8f8f6;border-left:3px solid #aaa;font-size:11px;color:#555;line-height:1.7">
        <strong style="color:#333">Technical notes:</strong> This report is generated from simulated machine parameters. Actual fabric properties will vary based on machine condition, yarn batch variation, ambient temperature and humidity, and operator settings. Validate all risk predictions with physical knit-downs before production release. CPI and WPI values are theoretical estimates based on gauge and runner length.
      </div>
    </div>`;
}

function printReport(){
  const el=document.getElementById('pdf-preview'); if(!el)return;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Tricot R&D Report</title>
    <style>body{font-family:Georgia,serif;margin:32px;color:#111}h1{font-size:22px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid #ddd;padding-bottom:4px;margin:16px 0 8px}table{width:100%;border-collapse:collapse;font-size:11px}td{padding:3px 0}td:last-child{text-align:right;font-weight:bold}@media print{body{margin:0}@page{margin:20mm}}</style>
    </head><body>${el.outerHTML}<script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

function copyReportText(){
  if(!simData.cfg)return;
  const {cfg,risks,stats}=simData;
  const RLBLS={hole:'Hole / run formation',breakage:'Yarn breakage',distortion:'Fabric distortion',density:'Density inconsistency',snag:'Snag potential',tension:'Tension imbalance'};
  const text=`TRICOT R&D PLATFORM — FABRIC CONFIGURATION REPORT\n${'='.repeat(50)}\nDate: ${new Date().toLocaleDateString()}\n\nMACHINE CONFIGURATION\n${'-'.repeat(30)}\nGauge: ${cfg.gauge} needles/inch\nGuide bars: ${cfg.bars}\nSpeed: ${cfg.speed} rpm\nYarn: ${cfg.yarn} ${cfg.dtex}dtex\nThreading: ${cfg.threading}\nLapping: ${cfg.laps.join(' / ')}\nTake-down: ${cfg.td} cN/cm\nRunner: ${cfg.rl} mm/rack\nWarp tension: ${cfg.wt} cN\n\nPREDICTED PROPERTIES\n${'-'.repeat(30)}\nCPI: ${stats.cpi} | WPI: ${stats.wpi} | Coverage: ${stats.coverage}%\nWeight: ${stats.weight} g/m² | Thickness: ${stats.thickness}mm\n\nRISK ASSESSMENT\n${'-'.repeat(30)}\n${Object.entries(risks).map(([k,v])=>`${RLBLS[k]}: ${v}% (${v>60?'HIGH':v>35?'MEDIUM':'LOW'})`).join('\n')}`;
  navigator.clipboard.writeText(text).then(()=>alert('Report copied to clipboard!')).catch(()=>alert('Copy failed — please use Print instead.'));
}
